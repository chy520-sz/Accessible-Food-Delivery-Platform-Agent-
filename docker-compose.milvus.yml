# Milvus 2.6 Standalone（单机）编排：milvus + etcd + MinIO
# 仅绑定到本机回环地址，避免对外暴露；数据使用命名卷持久化。
# 启动: docker compose -f docker-compose.milvus.yml up -d
# 状态: docker compose -f docker-compose.milvus.yml ps
# 日志: docker compose -f docker-compose.milvus.yml logs --tail 100
# 停止: docker compose -f docker-compose.milvus.yml down          （保留数据）
# 清库: docker compose -f docker-compose.milvus.yml down -v       （删除数据卷，慎用）

name: takeout-milvus

services:
  etcd:
    container_name: takeout-milvus-etcd
    image: quay.io/coreos/etcd:v3.5.21
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - milvus_etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - milvus-net

  minio:
    container_name: takeout-milvus-minio
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - milvus_minio:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - milvus-net

  standalone:
    container_name: takeout-milvus-standalone
    image: milvusdb/milvus:v2.6.0
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      # 只绑定本机回环；需要远程访问时改为 0.0.0.0 或具体网卡 IP
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - milvus-net

networks:
  milvus-net:
    driver: bridge

volumes:
  milvus_etcd:
  milvus_minio:
  milvus_data:
